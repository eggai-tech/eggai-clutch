name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code quality checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.11-
            uv-${{ runner.os }}-

      - name: Check lock file is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

  changelog:
    runs-on: ubuntu-latest
    name: Changelog check
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - name: Check if changelog skip requested
        id: skip-check
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$PR_LABELS" | grep -q "skip-changelog"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip-changelog label found, skipping changelog check"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.skip-check.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Check if changelog is required
        if: steps.skip-check.outputs.skip != 'true'
        id: needs-changelog
        run: |
          # Changelog is required if the PR touches code or test files.
          # PRs that only touch .github/, examples/, docs, or root config files
          # are auto-skipped — no label needed.
          CHANGED=$(git diff origin/main --name-only)
          CODE_CHANGED=$(echo "$CHANGED" | grep -E "^(eggai_clutch/|tests/|pyproject\.toml)" | grep -v "^CHANGELOG.md" || true)

          if [ -z "$CODE_CHANGED" ]; then
            echo "required=false" >> $GITHUB_OUTPUT
            echo "No code changes — changelog not required."
          else
            echo "required=true" >> $GITHUB_OUTPUT
            echo "Code changed — changelog required:"
            echo "$CODE_CHANGED"
          fi

      - name: Check CHANGELOG.md updated
        if: steps.skip-check.outputs.skip != 'true' && steps.needs-changelog.outputs.required == 'true'
        run: |
          if ! git diff origin/main --name-only | grep -q "CHANGELOG.md"; then
            echo "::error::CHANGELOG.md must be updated. Add your changes under [Unreleased] section."
            exit 1
          fi

      - name: Check changelog content
        if: steps.skip-check.outputs.skip != 'true' && steps.needs-changelog.outputs.required == 'true'
        env:
          IS_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            if ! grep -qE "## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
              echo "::error::Release PR must have a version section (e.g., ## [0.2.0] - 2025-01-01)"
              exit 1
            fi
            echo "Release changelog check passed!"
          else
            UNRELEASED=$(sed -n '/## \[Unreleased\]/,/## \[/p' CHANGELOG.md | sed '1d;$d')
            if ! echo "$UNRELEASED" | grep -qE "^### "; then
              echo "::error::Add a category header (### Added, ### Fixed, etc.) under [Unreleased] in CHANGELOG.md"
              exit 1
            fi
            if ! echo "$UNRELEASED" | grep -qE "^- "; then
              echo "::error::Add at least one entry (- description) under [Unreleased] in CHANGELOG.md"
              exit 1
            fi
            echo "Changelog check passed!"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: Test (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest -v --cov=eggai_clutch --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    name: Build and verify package

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Test package installation
        run: |
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install --upgrade pip
          /tmp/test-venv/bin/pip install dist/*.whl

          /tmp/test-venv/bin/python -c "import eggai_clutch; print(f'eggai-clutch version: {eggai_clutch.__version__}')"
          /tmp/test-venv/bin/python -c "from eggai_clutch import Clutch, Strategy, Terminate, Handover"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-python-3.11
          path: dist/
          retention-days: 30

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [lint, changelog, test, build]
    if: always()

    steps:
      - name: Check if all jobs passed
        env:
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGELOG_RESULT" != "success" && "$CHANGELOG_RESULT" != "skipped" ]]; then
            echo "Changelog check failed"
            exit 1
          fi

          if [[ "$LINT_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
